[package]
name = "akatsuki-sync"
description = "Akatsuki sync worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "akatsuki-sync"
path = "src/main.rs"

# Loopback fake IMAP + SMTP servers for the local end-to-end harness (scripts/e2e-local.mjs, D-382).
# Only built with `--features e2e-fakes`; the release image builds `--bin akatsuki-sync` alone.
[[bin]]
name = "akatsuki-fake-mail"
path = "src/bin/fake_mail.rs"
required-features = ["e2e-fakes"]

[features]
e2e-fakes = ["akatsuki-providers/fake-servers"]

[lints]
workspace = true

[dependencies]
akatsuki-core.workspace = true
akatsuki-mime.workspace = true
akatsuki-providers.workspace = true
akatsuki-convex-api.workspace = true
akatsuki-search.workspace = true
axum.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
reqwest.workspace = true
base64.workspace = true
sha2.workspace = true
hmac.workspace = true
hkdf.workspace = true
hex.workspace = true
chacha20poly1305.workspace = true
getrandom.workspace = true
url.workspace = true
percent-encoding.workspace = true
async-trait.workspace = true
futures.workspace = true
bytes.workspace = true
uuid.workspace = true
jsonwebtoken.workspace = true

[dev-dependencies]
# The in-process fake IMAP server: engine tests run the real IMAP adapter (D-410).
akatsuki-providers = { workspace = true, features = ["fake-servers"] }
tokio = { workspace = true, features = ["test-util"] }
tower.workspace = true
http-body-util = "=0.1.5"
wiremock.workspace = true
tempfile.workspace = true
jiff.workspace = true
rsa.workspace = true
rand08.workspace = true
p256.workspace = true
