[package]
name = "akatsuki-desktop"
description = "Akatsuki desktop app (GPUI)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "akatsuki-desktop"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
akatsuki-core = { workspace = true, features = ["store"] }
akatsuki-convex-api.workspace = true
akatsuki-search.workspace = true
akatsuki-mime.workspace = true
akatsuki-ai.workspace = true
akatsuki-tokens.workspace = true
akatsuki-shortcuts.workspace = true
gpui.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
reqwest.workspace = true
url.workspace = true
uuid.workspace = true
base64.workspace = true
sha2.workspace = true
hex.workspace = true
jiff.workspace = true
rand08.workspace = true
keyring.workspace = true
dirs.workspace = true
unicode-segmentation.workspace = true
# Not used directly: pins the version gpui's dependency tree compiles with (see the workspace).
libc.workspace = true

[dev-dependencies]
wiremock.workspace = true
pretty_assertions.workspace = true

# Compile the Metal shaders at runtime on macOS, so building doesn't need Xcode's offline Metal
# compiler (same as ref/Siberia).
[target.'cfg(target_os = "macos")'.dependencies]
gpui = { workspace = true, features = ["runtime_shaders"] }
