packages:
  - apps/web
  - apps/landing
  - apps/mobile
  - apps/api
  - packages/*
  - convex

engineStrict: true
autoInstallPeers: true
strictPeerDependencies: false
linkWorkspacePackages: true
saveExact: true
# Packages allowed to run install scripts (pnpm blocks them by default).
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - '@ai-sdk/anthropic@4.0.83'
  - '@ai-sdk/gateway@4.0.118'
  - '@ai-sdk/google@4.0.100'
  - '@ai-sdk/openai-compatible@3.0.73'
  - '@ai-sdk/openai@4.0.97'
  - '@ai-sdk/provider-utils@5.0.63'
  - '@ai-sdk/provider@4.0.30'
  - ai@7.0.145
  - '@expo/cli@58.1.13'
  - '@expo/metro-config@58.0.15'
  - '@expo/router-server@58.0.15'
  - babel-preset-expo@58.0.18
  - expo-asset@58.0.17
  - expo-file-system@58.0.10
  - expo-font@58.0.9
  - expo-localization@58.0.5
  - expo-modules-cli@0.3.1
  - expo-modules-core@58.0.23
  - expo-modules-jsi@58.0.16
  - expo-router@58.0.24
  - expo@58.0.16
