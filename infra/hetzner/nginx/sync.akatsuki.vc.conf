# managed-by: akatsuki (infra/hetzner/nginx/sync.akatsuki.vc.conf). Do not edit on the server; change it in
# git and redeploy with scripts/deploy-hetzner.sh, which runs `nginx -t` before any reload.
#
# sync.akatsuki.vc -> akatsuki-sync on 127.0.0.1:47310 (infra/hetzner/docker-compose.yml).
# Contract: ARCHITECTURE §7 (routes, bodies, caching), §7.1/§14.2 (no query strings or tokens in logs),
# §13.4 (per-user limits live in the worker; the limits here are coarse per-IP abuse guards).
#
# This file sits in the http{} context of the shared host nginx. Every zone, map, upstream and log format
# below carries an akatsuki_sync_ prefix so it can never collide with another site's names.
# Requires nginx >= 1.19 (Ubuntu 24.04 ships 1.24). On nginx >= 1.25.1 `listen ... http2` still works but
# logs a deprecation warning; switch to `http2 on;` in both vhosts when the host nginx is upgraded.

# ---- rate limiting (per client IP; the worker enforces the per-user limits of §13.4) ----
limit_req_zone $binary_remote_addr zone=akatsuki_sync_req:20m rate=50r/s;
limit_req_zone $binary_remote_addr zone=akatsuki_sync_connect:10m rate=30r/m;
# Provider webhooks arrive from a few Google and Microsoft addresses at high volume.
limit_req_zone $binary_remote_addr zone=akatsuki_sync_hooks:10m rate=200r/s;
# Graph notifications are checked against the worker's in-memory subscription table (D-405), so a forged batch
# costs no Convex call; this is a coarser cap than Gmail's, which verifies a Google OIDC token first.
limit_req_zone $binary_remote_addr zone=akatsuki_sync_graph:10m rate=50r/s;
limit_conn_zone $binary_remote_addr zone=akatsuki_sync_conn:10m;

# ---- access log without query strings, tokens, capability URLs or client IPs ----
# $uri never contains the query string. Path segments that are secrets (capability tokens, signed image
# URLs whose last segment is the original image URL, read-receipt tokens) are replaced.
map $uri $akatsuki_sync_log_path {
    default                 $uri;
    ~^/v1/img/              /v1/img/:redacted;
    ~^/v1/l/                /v1/l/:token;
    ~^/r/                   /r/:token;
}
log_format akatsuki_sync escape=json
    '{"t":"$time_iso8601","host":"$host","m":"$request_method","p":"$akatsuki_sync_log_path",'
    '"proto":"$server_protocol","s":$status,"b":$body_bytes_sent,"rt":$request_time,'
    '"urt":"$upstream_response_time","ua":"$http_user_agent"}';

upstream akatsuki_sync_upstream {
    server 127.0.0.1:47310 max_fails=0;
    keepalive 32;
}

# ---- port 80: ACME http-01 challenges and the redirect to https ----
server {
    listen 80;
    server_name sync.akatsuki.vc;
    server_tokens off;
    access_log /var/log/nginx/akatsuki-sync.access.log akatsuki_sync;
    error_log /var/log/nginx/akatsuki-sync.error.log crit;

    # certbot certonly --webroot -w /opt/akatsuki/acme -d sync.akatsuki.vc (docs/DEPLOY.md)
    location ^~ /.well-known/acme-challenge/ {
        root /opt/akatsuki/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- port 443 ----
server {
    # IPv4 only, matching the Cloudflare A record. To serve IPv6, add `listen [::]:443 ssl http2;` here and
    # `listen [::]:80;` above together with an AAAA record.
    listen 443 ssl http2;
    server_name sync.akatsuki.vc;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/sync.akatsuki.vc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sync.akatsuki.vc/privkey.pem;
    # Mozilla "intermediate" (ECDHE only, so no dhparam file is needed). Session cache and stapling are left
    # to the host's global config so this file cannot clash with another site's shared zones.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "no-referrer" always;

    access_log /var/log/nginx/akatsuki-sync.access.log akatsuki_sync;
    # The error log is the only nginx log that would print a full request line (with its query string),
    # so it records only critical events. 4xx/5xx still show in the access log above.
    error_log /var/log/nginx/akatsuki-sync.error.log crit;

    # ---- timeouts and bodies ----
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 60s;
    keepalive_timeout 65s;
    # JSON bodies are capped at 2 MiB by the worker (DefaultBodyLimit). Keeping the whole body in memory
    # means drafts and IMAP passwords are never written to nginx's client_body_temp on disk.
    client_max_body_size 2m;
    client_body_buffer_size 2m;

    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level warn;
    limit_conn akatsuki_sync_conn 64;

    # ---- proxy defaults ----
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Overwritten, never appended, so a client cannot forge the chain. The worker also uses the presence
    # of forwarding headers to refuse /metrics from the public side.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    # Message bodies and attachments must never land in nginx's proxy_temp on disk: responses that do not
    # fit the memory buffers are passed through synchronously instead.
    proxy_max_temp_file_size 0;
    proxy_buffers 16 64k;
    proxy_busy_buffers_size 128k;
    proxy_redirect off;

    # Prometheus metrics are for the internal Docker network only (§7.2).
    location = /metrics {
        return 404;
    }

    location = /healthz {
        access_log off;
        proxy_pass http://akatsuki_sync_upstream;
    }

    # Gmail Pub/Sub push and Microsoft Graph notifications (provider-authenticated, §9.6, §14.5). Graph
    # validation must be answered within 10 s.
    location /hooks/ {
        limit_req zone=akatsuki_sync_hooks burst=1000 nodelay;
        client_max_body_size 1m;
        proxy_read_timeout 15s;
        proxy_pass http://akatsuki_sync_upstream;
    }
    # Graph batches carry at most 50 notifications (the worker refuses more, D-405): 256 KB is ample.
    location /hooks/graph {
        limit_req zone=akatsuki_sync_graph burst=200 nodelay;
        client_max_body_size 256k;
        proxy_read_timeout 15s;
        proxy_pass http://akatsuki_sync_upstream;
    }

    # OAuth start, completion, IMAP connect and discovery: the worker allows 10 connects/h and 60 discoveries/h
    # per user (apps/sync::limits, D-397) and reaches only public mail hosts (D-398); this caps each IP too.
    location /v1/connect/ {
        limit_req zone=akatsuki_sync_connect burst=10 nodelay;
        client_max_body_size 16k;
        # An IMAP connect tests LOGIN and SMTP AUTH live against the user's host.
        proxy_read_timeout 60s;
        proxy_pass http://akatsuki_sync_upstream;
    }
    location /oauth/ {
        limit_req zone=akatsuki_sync_connect burst=10 nodelay;
        client_max_body_size 1k;
        proxy_read_timeout 30s;
        proxy_pass http://akatsuki_sync_upstream;
    }

    # Uploads: raw body up to 25 MB (§7.2). Streamed to the worker, which encrypts it into the spool, so
    # the plaintext attachment never touches nginx's disk.
    location = /v1/uploads {
        limit_req zone=akatsuki_sync_req burst=50 nodelay;
        client_max_body_size 26m;
        proxy_request_buffering off;
        client_body_timeout 120s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_pass http://akatsuki_sync_upstream;
    }

    # NDJSON streams of bodies, sent as they are fetched from the provider (§7.2).
    location ~ ^/v1/threads/[^/]+/bodies$ {
        limit_req zone=akatsuki_sync_req burst=300 nodelay;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_pass http://akatsuki_sync_upstream;
    }
    location = /v1/prefetch {
        limit_req zone=akatsuki_sync_req burst=300 nodelay;
        client_max_body_size 64k;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_pass http://akatsuki_sync_upstream;
    }

    # Attachment bytes and capability links: large streamed downloads with Range support.
    location ~ ^/v1/messages/[^/]+/parts/ {
        limit_req zone=akatsuki_sync_req burst=300 nodelay;
        proxy_buffering off;
        proxy_read_timeout 300s;
        send_timeout 300s;
        proxy_pass http://akatsuki_sync_upstream;
    }
    location /v1/l/ {
        limit_req zone=akatsuki_sync_req burst=100 nodelay;
        client_max_body_size 1k;
        proxy_buffering off;
        proxy_read_timeout 300s;
        send_timeout 300s;
        proxy_pass http://akatsuki_sync_upstream;
    }

    # Image proxy: the worker fetches with a 10 s timeout and a 10 MB cap (§14.4).
    location /v1/img/ {
        limit_req zone=akatsuki_sync_req burst=300 nodelay;
        client_max_body_size 1k;
        proxy_read_timeout 30s;
        proxy_pass http://akatsuki_sync_upstream;
    }

    # Read-receipt pixel.
    location /r/ {
        limit_req zone=akatsuki_sync_req burst=50 nodelay;
        client_max_body_size 1k;
        proxy_read_timeout 10s;
        proxy_pass http://akatsuki_sync_upstream;
    }

    # Everything else: authenticated JSON routes (/v1/messages, /v1/drafts, /v1/send, /v1/search, ...).
    location / {
        limit_req zone=akatsuki_sync_req burst=200 nodelay;
        proxy_pass http://akatsuki_sync_upstream;
    }
}
