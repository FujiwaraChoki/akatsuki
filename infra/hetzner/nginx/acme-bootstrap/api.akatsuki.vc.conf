# managed-by: akatsuki (infra/hetzner/nginx/acme-bootstrap/api.akatsuki.vc.conf).
#
# First-deploy bootstrap for api.akatsuki.vc: port 80 only, so `nginx -t` passes before the certificate
# exists. scripts/deploy-hetzner.sh installs it under the final vhost name, reloads nginx, runs
#   certbot certonly --webroot -w /opt/akatsuki/acme -d api.akatsuki.vc
# and then replaces it with ../api.akatsuki.vc.conf (nginx -t again before the second reload).
server {
    listen 80;
    server_name api.akatsuki.vc;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/akatsuki-api.error.log crit;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/akatsuki/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 404;
    }
}
