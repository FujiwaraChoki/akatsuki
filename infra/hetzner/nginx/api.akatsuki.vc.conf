# managed-by: akatsuki (infra/hetzner/nginx/api.akatsuki.vc.conf). Do not edit on the server; change it in
# git and redeploy with scripts/deploy-hetzner.sh, which runs `nginx -t` before any reload.
#
# api.akatsuki.vc -> akatsuki-api on 127.0.0.1:47311 (infra/hetzner/docker-compose.yml).
# Contract: ARCHITECTURE §8 (routes, body limits, no-store), §12.6 (AASP over SSE), §13.4 (limits; the
# per-user limits live in Convex and apps/api, the ones here are coarse per-IP abuse guards), D-048
# (/internal/ is denied publicly; the worker reaches it over the akatsuki-net Docker network).
#
# This file sits in the http{} context of the shared host nginx. Every zone, map, upstream and log format
# below carries an akatsuki_api_ prefix so it can never collide with another site's names.
# Requires nginx >= 1.19 (Ubuntu 24.04 ships 1.24). On nginx >= 1.25.1 `listen ... http2` still works but
# logs a deprecation warning; switch to `http2 on;` in both vhosts when the host nginx is upgraded.

# ---- rate limiting (per client IP) ----
limit_req_zone $binary_remote_addr zone=akatsuki_api_req:20m rate=20r/s;
# Managed AI: 30 requests/min per user are enforced by ee.service.aiPrecheck; 2/s per IP leaves room for a
# few users behind one NAT while capping a single abusive address.
limit_req_zone $binary_remote_addr zone=akatsuki_api_ai:20m rate=2r/s;
# Checkout, portal, cancel: apps/api allows 10 checkouts/h per user.
limit_req_zone $binary_remote_addr zone=akatsuki_api_billing:10m rate=30r/m;
# Stripe webhooks come from Stripe's published addresses.
limit_req_zone $binary_remote_addr zone=akatsuki_api_hooks:10m rate=50r/s;
# Concurrent SSE streams per IP.
limit_conn_zone $binary_remote_addr zone=akatsuki_api_conn:10m;

# ---- access log without query strings or client IPs ($uri never contains the query string) ----
log_format akatsuki_api escape=json
    '{"t":"$time_iso8601","host":"$host","m":"$request_method","p":"$uri",'
    '"proto":"$server_protocol","s":$status,"b":$body_bytes_sent,"rt":$request_time,'
    '"urt":"$upstream_response_time","ua":"$http_user_agent"}';

upstream akatsuki_api_upstream {
    server 127.0.0.1:47311 max_fails=0;
    keepalive 32;
}

# ---- port 80: ACME http-01 challenges and the redirect to https ----
server {
    listen 80;
    server_name api.akatsuki.vc;
    server_tokens off;
    access_log /var/log/nginx/akatsuki-api.access.log akatsuki_api;
    error_log /var/log/nginx/akatsuki-api.error.log crit;

    # certbot certonly --webroot -w /opt/akatsuki/acme -d api.akatsuki.vc (docs/DEPLOY.md)
    location ^~ /.well-known/acme-challenge/ {
        root /opt/akatsuki/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- port 443 ----
server {
    # IPv4 only, matching the Cloudflare A record. To serve IPv6, add `listen [::]:443 ssl http2;` here and
    # `listen [::]:80;` above together with an AAAA record.
    listen 443 ssl http2;
    server_name api.akatsuki.vc;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/api.akatsuki.vc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.akatsuki.vc/privkey.pem;
    # Mozilla "intermediate" (ECDHE only, so no dhparam file is needed). Session cache and stapling are left
    # to the host's global config so this file cannot clash with another site's shared zones.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "no-referrer" always;

    access_log /var/log/nginx/akatsuki-api.access.log akatsuki_api;
    # The error log is the only nginx log that would print a full request line (with its query string),
    # so it records only critical events. 4xx/5xx still show in the access log above.
    error_log /var/log/nginx/akatsuki-api.error.log crit;

    # ---- timeouts and bodies ----
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 60s;
    keepalive_timeout 65s;
    # apps/api caps plain JSON at 16 KiB. Bodies are kept in memory so AI vars (message text) are never
    # written to nginx's client_body_temp on disk.
    client_max_body_size 64k;
    client_body_buffer_size 64k;

    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level warn;

    # ---- proxy defaults ----
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_max_temp_file_size 0;
    proxy_redirect off;

    # Worker-only service routes (D-048). Also guarded by a worker service JWT inside apps/api.
    location ^~ /internal/ {
        return 404;
    }

    location = /healthz {
        access_log off;
        proxy_pass http://akatsuki_api_upstream;
    }

    # Dictation: multipart audio up to 25 MB and 10 min (§8). Streamed to apps/api without touching disk.
    location = /v1/ai/transcribe {
        limit_req zone=akatsuki_api_ai burst=10 nodelay;
        limit_conn akatsuki_api_conn 20;
        client_max_body_size 26m;
        proxy_request_buffering off;
        client_body_timeout 120s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_pass http://akatsuki_api_upstream;
    }

    # Managed AI: AASP over text/event-stream (§12.6). Buffering off so every frame is flushed as soon as
    # apps/api writes it; long read timeout for slow reasoning models. Bodies are capped at 256 KiB.
    location /v1/ai/ {
        limit_req zone=akatsuki_api_ai burst=30 nodelay;
        limit_conn akatsuki_api_conn 20;
        client_max_body_size 260k;
        client_body_buffer_size 260k;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 300s;
        send_timeout 300s;
        proxy_pass http://akatsuki_api_upstream;
    }

    location /v1/billing/ {
        limit_req zone=akatsuki_api_billing burst=10 nodelay;
        client_max_body_size 16k;
        # Checkout and portal sessions are created synchronously against Stripe.
        proxy_read_timeout 30s;
        proxy_pass http://akatsuki_api_upstream;
    }

    # Stripe webhook: raw body (signature verified in apps/api), ≤ 1 MiB.
    location = /hooks/stripe {
        limit_req zone=akatsuki_api_hooks burst=200 nodelay;
        client_max_body_size 1m;
        client_body_buffer_size 1m;
        proxy_read_timeout 30s;
        proxy_pass http://akatsuki_api_upstream;
    }

    location / {
        limit_req zone=akatsuki_api_req burst=100 nodelay;
        proxy_pass http://akatsuki_api_upstream;
    }
}
